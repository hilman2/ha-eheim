name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  tests:
    name: Tests and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check custom_components scripts tests
      - run: uv run ruff format --check custom_components scripts tests
      - run: uv run mypy custom_components/eheimdigital_plus scripts
      - run: uv run pytest -q --cov=custom_components.eheimdigital_plus --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
      - run: uv run python -m scripts.check_quality coverage.json
