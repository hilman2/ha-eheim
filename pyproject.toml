[project]
name = "ha-eheim"
version = "0.2.0"
description = "EHEIM Digital custom integration with a bundled device protocol library"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP049"]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
implicit_reexport = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["probatio", "probatio.*"]
ignore_missing_imports = true
